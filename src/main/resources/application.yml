spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/fams}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:rashy0207}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
        types:
          print:
            banner: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cache:
    type: caffeine
    cache-names: dashboardKpis,reports
    caffeine:
      spec: maximumSize=500,expireAfterWrite=${fams.kpi.cache-ttl-seconds:60}s
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${ISSUER_URI:https://ngcloak-production.up.railway.app/realms/mobile-auth-realm}

        registration:
          keycloak:
            provider: keycloak
            client_id: ${KEYCLOAK_CLIENT_ID:auth-mobile}
            client_secret: ${KEYCLOAK_CLIENT_SECRET:sTZZkB0OSJXpuot1QAOTTooPoG5lkElF}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      ProcessModelIdUnique: PROCESS_MODEL_ID_UNIQUE
      ProcessProcessNameUnique: PROCESS_PROCESS_NAME_UNIQUE
      ValidFileType: VALID_FILE_TYPE
logging:
  level:
    com.example.fams.aau.keycloak: INFO
    com.example.fams.aau.keycloak.UserSyncService: INFO
server:
  tomcat:
    max-part-count: '100'

fams:
  kpi:
    # SLA window (seconds): cached dashboard KPIs / reports are never older than this
    # and are refreshed within it. Lower = fresher data, higher = less DB load.
    cache-ttl-seconds: 60
  user-sync:
    # Refresh the local synced Keycloak user snapshot every 5 minutes by default.
    interval-ms: ${FAMS_USER_SYNC_INTERVAL_MS:300000}
  company-structure:
    base-url: ${COMPANY_STRUCTURE_BASE_URL:http://localhost:9006}
    company-id: 1
    sync-interval-ms: ${COMPANY_STRUCTURE_SYNC_INTERVAL_MS:21600000}
    connect-timeout-ms: ${COMPANY_STRUCTURE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${COMPANY_STRUCTURE_READ_TIMEOUT_MS:10000}
    retry-period-ms: ${COMPANY_STRUCTURE_RETRY_PERIOD_MS:200}
    retry-max-period-ms: ${COMPANY_STRUCTURE_RETRY_MAX_PERIOD_MS:1000}
    retry-max-attempts: ${COMPANY_STRUCTURE_RETRY_MAX_ATTEMPTS:3}

keycloak:
  base-url: ${KEYCLOAK_BASE_URI:https://ngcloak-production.up.railway.app}
  base-realm: mobile-auth-realm
  client-id: ${KEYCLOAK_CLIENT_ID:auth-mobile}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:sTZZkB0OSJXpuot1QAOTTooPoG5lkElF}
  realm: mobile-auth-realm
  sync-realm: ${KEYCLOAK_SYNC_REALM:${keycloak.realm}}
  admin-connect-timeout-ms: ${KEYCLOAK_ADMIN_CONNECT_TIMEOUT_MS:5000}
  admin-read-timeout-ms: ${KEYCLOAK_ADMIN_READ_TIMEOUT_MS:10000}
  admin-client-id: admin-cli-client
  admin-client-secret: nolXS4BpUfMbUjcevhyx1jAB51L9fxw9

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:fams/assets}
feign:
  client:
    config:
      companyStructureClient:
        connectTimeout: ${COMPANY_STRUCTURE_CONNECT_TIMEOUT_MS:5000}
        readTimeout: ${COMPANY_STRUCTURE_READ_TIMEOUT_MS:10000}
        loggerLevel: full
